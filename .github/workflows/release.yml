name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package release zip
        run: |
          mkdir -p dist/BetterDiscordUpdaterLock
          cp BetterDiscordUpdaterLock.bat dist/BetterDiscordUpdaterLock/
          cp README.md dist/BetterDiscordUpdaterLock/
          cp LICENSE dist/BetterDiscordUpdaterLock/
          cp -r scripts dist/BetterDiscordUpdaterLock/
          cd dist
          zip -r "BetterDiscordUpdaterLock-${GITHUB_REF_NAME}.zip" BetterDiscordUpdaterLock

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BetterDiscordUpdaterLock-${{ github.ref_name }}.zip
          generate_release_notes: true
